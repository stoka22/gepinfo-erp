name: Deploy to DotRoll

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}     # pl. /home/USER/web-server/web2
      PHP_BIN: ${{ secrets.PHP_BIN }}             # pl. /usr/local/bin/php83 (ha üres: autodetekció a távolin)
      RUN_MIGRATIONS: ${{ secrets.RUN_MIGRATIONS || 'false' }}
      RELEASE: ${{ github.sha }}
      RELEASES_TO_KEEP: "3"

    steps:
      - name: Marker
        shell: bash
        run: |
          echo "WORKFLOW VERSION: 2025-10-05-7"

      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql, bcmath, gd
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Prepare Laravel cache dirs
        shell: bash
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,views}

      - name: Composer install (prod, no scripts)
        shell: bash
        env:
          COMPOSER_NO_INTERACTION: "1"
          COMPOSER_NO_AUDIT: "1"
          COMPOSER_PROCESS_TIMEOUT: "0"
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --prefer-dist --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: NPM ci + build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "vendor/bin" \
            --exclude "tests" \
            --exclude "storage/framework/cache/data/*" \
            --exclude "storage/framework/sessions/*" \
            --exclude "storage/framework/testing/*" \
            --exclude "storage/logs/*" \
            --exclude ".env" \
            ./ deploy/
          rsync -a vendor/ deploy/vendor/
          if [ -d public/build ]; then
            mkdir -p deploy/public/build
            rsync -a public/build/ deploy/public/build/
          fi

      - name: Setup SSH (decode key, add host)
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "echo 'SSH OK'"

      - name: Ensure shared/.env (safe upload, always overwrite)
        shell: bash
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          R="$REMOTE_PATH"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$R/shared'"
          # CRLF eltávolítás; NEM expandálunk helyben
          printf '%s' "$ENV_PROD" | sed 's/\r$//' \
            | ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "install -m 600 /dev/stdin '$R/shared/.env'"

      - name: Upload release (tar over SSH)
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          R="$REMOTE_PATH"
          REL="$RELEASE"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$R/releases/$REL'"
          tar -C deploy -czf - . \
            | ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "tar -C '$R/releases/$REL' -xzf -"

      - name: Activate release & run post-deploy
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REM="$REMOTE_PATH"
          REL="$RELEASE"
          KEEP="${RELEASES_TO_KEEP:-3}"
          RUN_MIGRATIONS="${RUN_MIGRATIONS}"

          # Változók átadása a távolinak; single-quoted here-doc = nincs lokális expanzió
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" \
            REM="$REM" REL="$REL" KEEP="$KEEP" RUN_MIGRATIONS="$RUN_MIGRATIONS" PHP_BIN="${PHP_BIN:-}" \
            'bash -s' <<'EOSSH'
          set -euo pipefail

          # --- távoli env: REM, REL, KEEP, RUN_MIGRATIONS, PHP_BIN ---

          # PHP autodetekció a TÁVOLIN
          if [ -n "${PHP_BIN:-}" ]; then
            PHP="$PHP_BIN"
          else
            PHP="$(command -v php83 || command -v php8.3 || command -v php || echo php)"
          fi
          "$PHP" -v >/dev/null 2>&1 || { echo "PHP not found on remote"; exit 127; }

          ART="$REM/releases/$REL/artisan"

          # shared struktúra
          mkdir -p "$REM/shared/storage/framework/cache" \
                  "$REM/shared/storage/framework/sessions" \
                  "$REM/shared/storage/framework/views" \
                  "$REM/shared/bootstrap/cache"

          # ABSZOLÚT symlinkek az új release-ben
          rm -rf "$REM/releases/$REL/storage" "$REM/releases/$REL/bootstrap/cache"
          ln -sfn "$REM/shared/storage"         "$REM/releases/$REL/storage"
          ln -sfn "$REM/shared/bootstrap/cache" "$REM/releases/$REL/bootstrap/cache"
          ln -sfn "$REM/shared/.env"            "$REM/releases/$REL/.env"

          # public/storage
          cd "$REM/releases/$REL"
          [ -L public/storage ] || "$PHP" "$ART" storage:link || true

          # jogosultságok
          chmod -R u+rwX,go-rwx "$REM/shared/storage" "$REM/shared/bootstrap" || true

          # A csomag-manifeszt (bootstrap/cache/packages.php / services.php) a shared/ alatt
          # van, tehát release-ek között megosztott. Ha egy régi, dev-függőséget (pl.
          # laravel/breeze) tartalmazó manifeszt marad érvényben egy --no-dev telepítés után,
          # AKKOR MÁR MAGA A BOOTSTRAP elhasal (a hiányzó osztály miatt) — méghozzá minden egyes
          # artisan-hívásnál, BELEÉRTVE a package:discover-t is, ami épp ezt lenne hivatott
          # kijavítani (tyúk-tojás probléma). Ezért itt, MIELŐTT bármilyen artisan-parancs
          # lefutna, egyszerűen töröljük a manifesztet — enélkül a keret üres listáról indulva
          # magától újraépíti a következő bootoláskor, a ténylegesen telepített (Breeze
          # nélküli) csomagokból, sosem hasalhat el egy fantom-osztályon.
          rm -f "$REM/shared/bootstrap/cache/packages.php" "$REM/shared/bootstrap/cache/services.php"

          # cachek (ABSZOLÚT artisan úttal)
          "$PHP" "$ART" optimize:clear || true
          "$PHP" "$ART" package:discover --ansi || true

          "$PHP" "$ART" config:cache  || true
          "$PHP" "$ART" route:cache   || true
          "$PHP" "$ART" view:cache    || true

          # migráció opcionális
          if [ "${RUN_MIGRATIONS}" = "true" ]; then
            "$PHP" "$ART" migrate --force || true
          fi

          # Éves szabadságkeret önjavítás minden deploy-nál: a scheduler (yearlyOn jan.1)
          # megosztott tárhelyen nem biztos, hogy fut, ez pótolja/frissíti updateOrCreate-tel,
          # tehát nem destruktív, ha többször is lefut.
          "$PHP" "$ART" vacation:rebuild --ansi || true

          # current felülírása biztosan
          [ -L "$REM/current" ] || rm -rf "$REM/current"
          ln -sfnT "$REM/releases/$REL" "$REM/current"

          # régi release-ek takarítása
          cd "$REM/releases"
          COUNT=$(ls -1dt * 2>/dev/null | wc -l | awk '{print $1}')
          if [ "$COUNT" -gt "$KEEP" ]; then
            ls -1dt * | awk "NR>$KEEP" | xargs -r -I{} rm -rf -- "$REM/releases/{}"
          fi

          # vissza az appba
          "$PHP" "$ART" up || true
          EOSSH

      - name: DIAGNOSTIC - map domains/subdomains to candidate app directories
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REM="$REMOTE_PATH"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" \
            REM="$REM" \
            'bash -s' <<'EOSSH'
          set -euo pipefail
          echo "=== ~/domains listing (all domains) ==="
          ls -la "$HOME/domains" 2>/dev/null || echo "no ~/domains"
          echo "=== ~/domains/budafererp.hu listing (root + subdomains) ==="
          ls -la "$HOME/domains/budafererp.hu" 2>/dev/null || true
          echo "=== ~/domains/budafererp.hu/subdomains (if that convention is used) ==="
          find "$HOME/domains/budafererp.hu" -maxdepth 1 -type d 2>/dev/null || true
          echo "=== resolve every public_html-like entry found under domains/budafererp.hu ==="
          for f in $(find "$HOME/domains/budafererp.hu" -maxdepth 2 -iname "public_html" 2>/dev/null); do
            echo "-- $f --"
            ls -la "$f"
            readlink -f "$f"
          done
          echo "=== web-server/gepinfo: does it look like THIS Laravel app (composer.json name, artisan)? ==="
          if [ -f "$HOME/web-server/gepinfo/artisan" ]; then
            grep -m1 '"name"' "$HOME/web-server/gepinfo/composer.json" 2>/dev/null || true
            ls -la "$HOME/web-server/gepinfo" | head -20
            echo "-- last modified --"
            stat -c '%y %n' "$HOME/web-server/gepinfo/artisan" 2>/dev/null || true
          else
            echo "no artisan here -- not a Laravel app root directly"
            ls -la "$HOME/web-server/gepinfo" 2>/dev/null | head -20
          fi
          echo "=== web-server/web2 (\$REM, this pipeline's target): current release + does it have public/build/manifest.json ==="
          readlink -f "$REM/current" 2>/dev/null || true
          ls -la "$REM/current/public/build/manifest.json" 2>/dev/null || true
          echo "=== web-server/web3, atelier, atelier2, www: quick peek (Laravel or something else?) ==="
          for d in web3 atelier atelier2 www; do
            echo "-- $HOME/web-server/$d --"
            [ -f "$HOME/web-server/$d/artisan" ] && echo "HAS artisan (Laravel!)" || echo "no artisan"
            ls -la "$HOME/web-server/$d" 2>/dev/null | head -10
          done
          echo "=== gepinfo.hu domain: public_html target ==="
          ls -la "$HOME/domains/gepinfo.hu" 2>/dev/null || true
          find "$HOME/domains/gepinfo.hu" -maxdepth 1 -iname "public_html" -exec ls -la {} \; -exec readlink -f {} \; 2>/dev/null || true
          echo "=== does that resolved target have a manifest.json with the camera key? ==="
          GEPINFO_ROOT="$(readlink -f "$HOME/domains/gepinfo.hu/public_html" 2>/dev/null || true)"
          echo "resolved: $GEPINFO_ROOT"
          if [ -n "$GEPINFO_ROOT" ]; then
            find "$GEPINFO_ROOT" -maxdepth 2 -iname "manifest.json" -exec echo {} \; -exec grep -o "camera-dashboard" {} \; 2>/dev/null || echo "no manifest.json found there"
          fi
          echo "=== atelierrobert.it and femalk-kft.hu (other domains, just names for context) ==="
          ls -la "$HOME/domains/atelierrobert.it" 2>/dev/null | head -5 || true
          EOSSH

      - name: Done
        shell: bash
        run: echo "Deployed release $RELEASE to $SSH_HOST:$REMOTE_PATH"
