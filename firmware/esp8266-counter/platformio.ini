[platformio]
default_envs = esp8266_debug

; Shared by every [env:*] section below unless explicitly overridden there.
; This is a SEPARATE, transitional project -- see README.md. It shares no
; source files with ../esp32-counter on purpose.
[env]
platform = espressif8266
; Adjust to the actual board in use (e.g. nodemcuv2, esp12e) -- d1_mini is
; just a common, reasonable default for this class of project.
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; USB upload, release build. This is the env that produces OTA-catalog
; binaries, hence the post-build copy into ota/firmware-<version>.bin.
[env:esp8266]
extra_scripts = post:extra_script.py

; Over-the-air upload once the device has enrolled and has OTA credentials.
[env:esp8266_ota]
upload_protocol = espota
upload_port = ESP8266_COUNTER.local

; USB upload, debug build.
[env:esp8266_debug]
build_type = debug
build_flags =
    -DDEBUG_ESP_PORT=Serial
