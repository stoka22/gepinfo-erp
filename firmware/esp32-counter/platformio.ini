[platformio]
default_envs = esp32dev_debug

; Shared by every [env:*] section below unless explicitly overridden there.
[env]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Deassert DTR/RTS on open instead of leaving them in whatever state the
; previous serial client (IDE monitor, another terminal, ...) left them in.
; A stray asserted line here is a common cause of the board getting stuck
; in / missing the auto-reset pulse on the next upload, which then forces
; a manual BOOT+RESET button sequence.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; USB upload, release build. This is the env that produces OTA-catalog
; binaries, hence the post-build copy into ota/firmware-<version>.bin.
[env:esp32dev]
extra_scripts = post:extra_script.py

; Over-the-air upload once the device has enrolled and has OTA credentials.
[env:esp32dev_ota]
upload_protocol = espota
upload_port = ESP32_COUNTER.local

; USB upload, debug build.
; CORE_DEBUG_LEVEL=2 (Warning) rather than 4 (Debug): the core's own
; internal logging (e.g. WiFiGeneric's _eventCallback() lines) writes to
; UART through a different, unbuffered path than Serial.println(), which
; at level 4 interleaves mid-line with our own output and makes the
; monitor unreadable. Level 2 keeps genuinely useful warnings (like
; NO_AP_FOUND) without the high-frequency event-level noise that causes
; it. Bump back to 4 temporarily if deep WiFi-stack debugging is needed
; again.
[env:esp32dev_debug]
monitor_filters = esp32_exception_decoder, debug
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=2
